<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#121417" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- iOS liest weder <link rel="manifest"> noch dessen Icons zuverlässig für "Zum
		     Home-Bildschirm" — die Apple-eigenen Tags/Icons sind dafür zusätzlich nötig
		     (Android/Chrome nutzt das von @vite-pwa/sveltekit injizierte Manifest). -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="repfuel" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
