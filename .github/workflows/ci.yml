# CI: Bei jedem Push/PR laufen Tests, Typecheck und Lint (siehe checks.yml).
# Docker-Images werden NICHT hier gebaut — dafür gibt es den manuellen
# Release-Workflow (release.yml): SemVer-Bump, GHCR-Push, GitHub-Release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
